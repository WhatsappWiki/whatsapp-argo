[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-argo"
version = "0.1.0"
description = "Pure Python Argo 1.2 binary codec for WhatsApp and GraphQL response data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "WhatsApp Wiki contributors"}]
dependencies = []
keywords = ["whatsapp", "argo", "graphql", "binary", "serialization", "codec"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/WhatsappWiki/whatsapp-argo"
Documentation = "https://github.com/WhatsappWiki/whatsapp-technical-wiki/blob/main/protocol/argo.md"
Source = "https://github.com/WhatsappWiki/whatsapp-argo"
Issues = "https://github.com/WhatsappWiki/whatsapp-argo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whatsapp_argo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
